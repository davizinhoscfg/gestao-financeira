<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão Financeira</title>
  <meta name="description" content="Painel simples de gestão financeira para pequenas empresas.">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Menu lateral (computador e tablet) -->
    <aside class="sidebar" aria-label="Menu principal">
      <div class="marca" id="marca"></div>
      <nav class="menu" id="menu-lateral"></nav>
      <div class="menu-rodape">
        <a href="#/configuracoes" class="menu-item" data-rota="configuracoes">
          <span class="menu-icone" data-icone="ajustes"></span><span>Configurações</span>
        </a>
      </div>
    </aside>

    <!-- Topo (celular) -->
    <header class="topo-mobile">
      <div class="marca" id="marca-mobile"></div>
      <a href="#/configuracoes" class="btn btn-ghost btn-sm" aria-label="Configurações">
        <span data-icone="ajustes"></span><span>Ajustes</span>
      </a>
    </header>

    <!-- Conteúdo das páginas -->
    <main class="conteudo" id="conteudo" tabindex="-1"></main>

    <!-- Barra inferior (celular) -->
    <nav class="barra-inferior" id="menu-inferior" aria-label="Menu principal"></nav>
  </div>

  <!-- Avisos (toasts) e janelas (modais) -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modais"></div>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Código do sistema (a ordem importa) -->
  <script src="js/utils.js"></script>
  <script src="js/exemplos.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/paginas/inicio.js"></script>
  <script src="js/paginas/orcamentos.js"></script>
  <script src="js/paginas/lancamentos.js"></script>
  <script src="js/paginas/clientes.js"></script>
  <script src="js/paginas/relatorios.js"></script>
  <script src="js/paginas/configuracoes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
